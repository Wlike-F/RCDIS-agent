server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: rcdis-agent
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${RCDIS_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rcdis_agent}
    username: ${RCDIS_DATASOURCE_USERNAME:postgres}
    password: ${RCDIS_DATASOURCE_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Existing installations were initialized from docs/database-schema.sql. Baseline at zero so
    # the idempotent V1 migration validates their structure before later migrations are applied.
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
    # Sizing placeholder for the pgvector embedding column, shared with rcdis.agent.memory.embedding-dimension
    # so the DDL dimension and the runtime embedding guard always agree. DashScope text-embedding-v3/v4 use
    # 1024; a different embedding model (e.g. SenseNova/piccolo) requires setting this to its output dimension.
    placeholders:
      embeddingDimension: ${RCDIS_AGENT_EMBEDDING_DIMENSION:1024}
  servlet:
    multipart:
      max-file-size: ${RCDIS_UPLOAD_MAX_FILE_SIZE:25MB}
      max-request-size: ${RCDIS_UPLOAD_MAX_REQUEST_SIZE:30MB}
  ai:
    openai:
      base-url: ${RCDIS_AI_OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${RCDIS_AI_OPENAI_CHAT_MODEL:qwen-plus}
          temperature: 0.2

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

rcdis:
  storage:
    upload-dir: ${RCDIS_STORAGE_UPLOAD_DIR:./uploads}
  agent:
    # Multi-turn memory window: how many recent user/assistant rows are fed back to the model.
    # Kept small on purpose; this bounds the prompt size.
    history-max-messages: ${RCDIS_AGENT_HISTORY_MAX_MESSAGES:20}
    # Persist only a bounded raw window. Older message content is redacted after compression.
    persistence-max-messages: ${RCDIS_AGENT_PERSISTENCE_MAX_MESSAGES:200}
    # Upper bound for a single streamed response. The SSE emitter adds 10s padding on top so the
    # service-level timeout fires first and produces a clean error event.
    stream-timeout-seconds: ${RCDIS_AGENT_STREAM_TIMEOUT_SECONDS:180}
    # Billing rates used to turn provider-reported token usage into a cost metric.
    # 按空闲时段（off-peak）价格估算：输入（缓存未命中）1元/百万tokens、输出 4元/百万tokens，
    # 换算为每千 tokens 即 0.001 / 0.004 元；可用环境变量覆盖。
    input-cost-per-thousand-tokens: ${RCDIS_AGENT_INPUT_COST_PER_1K:0.001}
    output-cost-per-thousand-tokens: ${RCDIS_AGENT_OUTPUT_COST_PER_1K:0.004}
    # Chinese system prompt; loaded once at startup and cached.
    system-prompt-location: ${RCDIS_AGENT_SYSTEM_PROMPT_LOCATION:classpath:prompts/agent-system.st}
    memory:
      # Cross-session semantic-memory relevance retrieval. OFF by default; when off the injection
      # path is the legacy newest-N set. Turn on only after pgvector + an embedding model exist.
      semantic-retrieval-enabled: ${RCDIS_AGENT_SEMANTIC_RETRIEVAL_ENABLED:false}
      # OpenAI-compatible embeddings model + path; reuse the default provider's key/base URL.
      embedding-model: ${RCDIS_AGENT_EMBEDDING_MODEL:text-embedding-v3}
      embeddings-path: ${RCDIS_AGENT_EMBEDDINGS_PATH:/v1/embeddings}
      # Must equal the Flyway placeholder above (same env var) and the model's output dimension.
      embedding-dimension: ${RCDIS_AGENT_EMBEDDING_DIMENSION:1024}
      # Max pgvector cosine distance (range 0..2) a memory may have and still be injected; <=0 turns
      # the gate off. Without it the vector lane always returns its LIMIT nearest neighbours, so an
      # irrelevant memory is injected merely because the user has memories.
      # Default 0.45 is MEASURED, not a rule of thumb: on the dev corpus with text-embedding-v3 the
      # pairwise cosine distance sits at avg 0.62 / p25 0.55 for unrelated content, while genuinely
      # related pairs cluster below 0.45 (near-duplicates below 0.10) — 0.45 lands in that valley.
      # It is embedding-model specific: after switching model, re-measure with
      # scripts/diag-vector-gate.sql or the developer-console retrieval probe before trusting it.
      semantic-vector-max-distance: ${RCDIS_AGENT_SEMANTIC_VECTOR_MAX_DISTANCE:0.45}
      # Caps on chat_session.summary_facts. The whole array is rendered into the prompt every turn,
      # so an unbounded array would make the compression mechanism the biggest prompt contributor.
      # Per-type stops one chatty type (tool_result) crowding out the rest; the total cap then
      # evicts lowest-priority oldest facts. <=0 disables the corresponding cap.
      facts-max-per-type: ${RCDIS_AGENT_FACTS_MAX_PER_TYPE:12}
      facts-max-total: ${RCDIS_AGENT_FACTS_MAX_TOTAL:60}
      # recall_history seq-span limit. The span counts internal role=tool rows too, so it is larger
      # than a conversation-turn count; recall-max-chars is the real payload bound.
      recall-max-turns: ${RCDIS_AGENT_RECALL_MAX_TURNS:20}
    ocr:
      # Async structured receipt recognition with a vision model; never blocks or fails the upload.
      enabled: ${RCDIS_AGENT_OCR_ENABLED:true}
      provider-id: ${RCDIS_AGENT_OCR_PROVIDER:code99}
      model: ${RCDIS_AGENT_OCR_MODEL:gpt-5.5}
    observability:
      # Period metrics window (agent_turn_trace aggregation) for the observability page.
      period-default-days: ${RCDIS_AGENT_METRICS_DEFAULT_DAYS:7}
      period-max-days: ${RCDIS_AGENT_METRICS_MAX_DAYS:15}
      # TTL: turn-trace rows older than this are purged daily; 0 disables the purge.
      trace-retention-days: ${RCDIS_AGENT_TRACE_RETENTION_DAYS:15}
  ai:
    # Master passphrase protecting the API keys stored in the model_provider table (AES-256/GCM).
    # Without it a development fallback key is used and a warning is logged at startup.
    secret-key: ${RCDIS_PROVIDER_SECRET_KEY:}
    # Providers below only seed the model_provider table on first startup. Afterwards they are
    # managed through /api/model-providers and edits made there always win.
    default-provider: dashscope
    providers:
      dashscope:
        name: DashScope Qwen
        type: openai-compatible
        base-url: ${RCDIS_AI_DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
        api-key: ${DASHSCOPE_API_KEY:}
        chat-model: ${RCDIS_AI_DASHSCOPE_CHAT_MODEL:qwen-plus}
        description: 阿里云百炼 OpenAI 兼容端点
        enabled: true
      local-ollama:
        name: Local Ollama
        type: openai-compatible
        # Service root only; /v1/chat/completions is appended from chat-completions-path.
        base-url: ${RCDIS_AI_OLLAMA_BASE_URL:http://localhost:11434}
        api-key: ${RCDIS_AI_OLLAMA_API_KEY:}
        chat-model: ${RCDIS_AI_OLLAMA_CHAT_MODEL:qwen2.5}
        description: 本地 Ollama，通过其 /v1 兼容端点接入，无需密钥
        enabled: false
  feishu:
    enabled: ${RCDIS_FEISHU_ENABLED:false}
    client-type: ${RCDIS_FEISHU_CLIENT_TYPE:webhook}
    open-api-base-url: ${RCDIS_FEISHU_OPEN_API_BASE_URL:https://open.feishu.cn}
    app-id: ${RCDIS_FEISHU_APP_ID:}
    app-secret: ${RCDIS_FEISHU_APP_SECRET:}
    default-receive-id-type: ${RCDIS_FEISHU_DEFAULT_RECEIVE_ID_TYPE:chat_id}
    default-receive-id: ${RCDIS_FEISHU_DEFAULT_RECEIVE_ID:}
    webhook-url: ${RCDIS_FEISHU_WEBHOOK_URL:}
    signing-secret: ${RCDIS_FEISHU_SIGNING_SECRET:}
    verification-token: ${RCDIS_FEISHU_VERIFICATION_TOKEN:}
    encrypt-key: ${RCDIS_FEISHU_ENCRYPT_KEY:}
    # none | ws | http. ws uses the official SDK long connection and needs no public endpoint.
    callback-mode: ${RCDIS_FEISHU_CALLBACK_MODE:none}
    card-action-signing-key: ${RCDIS_FEISHU_CARD_ACTION_SIGNING_KEY:}
    approval-card-enabled: ${RCDIS_FEISHU_APPROVAL_CARD_ENABLED:true}
    max-attempts: ${RCDIS_FEISHU_MAX_ATTEMPTS:3}
    tenant-token-refresh-skew-seconds: ${RCDIS_FEISHU_TENANT_TOKEN_REFRESH_SKEW_SECONDS:300}
  security:
    auth-required: ${RCDIS_SECURITY_AUTH_REQUIRED:true}
    jwt:
      issuer: ${RCDIS_SECURITY_JWT_ISSUER:rcdis-agent}
      secret: ${RCDIS_SECURITY_JWT_SECRET:rcdis-agent-local-development-secret-change-me}
      access-token-ttl-minutes: ${RCDIS_SECURITY_JWT_ACCESS_TOKEN_TTL_MINUTES:120}
    # Seed accounts are inserted on first startup only; afterwards users are managed through
    # /api/users and edits made there always win. Override the admin password through environment
    # variables in any real deployment; never ship the default to production.
    seed-users:
      - username: ${RCDIS_SECURITY_ADMIN_USERNAME:admin}
        password: ${RCDIS_SECURITY_ADMIN_PASSWORD:admin123}
        display-name: 系统管理员
        tenant-id: ${RCDIS_SECURITY_ADMIN_TENANT_ID:default}
        roles:
          - ADMIN

logging:
  level:
    com.rcdis.agent: INFO

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
