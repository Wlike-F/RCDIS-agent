spring:
  datasource:
    url: jdbc:h2:mem:rcdis_agent_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  ai:
    openai:
      api-key: test-key
  sql:
    init:
      mode: always
  flyway:
    # H2 tests intentionally use their dedicated schema.sql. Production migrations target
    # PostgreSQL-specific behavior and are verified separately.
    enabled: false

rcdis:
  security:
    auth-required: false
    jwt:
      issuer: rcdis-agent-test
      secret: rcdis-agent-test-secret-with-at-least-32-bytes
      access-token-ttl-minutes: 30
    # Three seeded accounts, one per built-in role, so authorization tests can log in as each.
    seed-users:
      - username: admin
        password: admin123
        display-name: 测试管理员
        tenant-id: test
        roles:
          - ADMIN
      - username: approver
        password: admin123
        display-name: 测试审批人
        tenant-id: test
        roles:
          - APPROVER
      - username: researcher
        password: admin123
        display-name: 测试科研人员
        tenant-id: test
        roles:
          - RESEARCHER
